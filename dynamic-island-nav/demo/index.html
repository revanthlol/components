<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dynamic Island Nav: React component demo</title>
    <meta name="description" content="Interactive demo of Dynamic Island Nav, a floating spring animated navigation component for React with scroll spy, compact scroll mode and a responsive menu." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='11' width='26' height='10' rx='5' fill='%23101013'/%3E%3Ccircle cx='9' cy='16' r='2.2' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: light; --ink: #8b8e98; }
      html { scroll-behavior: auto; }
      body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; }
      .band { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 96px 24px; box-sizing: border-box; text-align: center; }
      .band-a { background: linear-gradient(#f7f7fa, #ecedf2); }
      .band-b { background: linear-gradient(#e2e4eb, #d8dbe3); }
      .band h1, .band h2 { margin: 0; font-size: clamp(52px, 9vw, 96px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: var(--ink); }
      .band p { margin: 0; max-width: 46ch; font-size: 17px; line-height: 1.5; color: #5d6070; }
      .panel { position: fixed; left: 16px; bottom: 16px; z-index: 20; width: 220px; padding: 12px; box-sizing: border-box; background: #fff; border: 1px solid rgba(15,15,20,.12); border-radius: 10px; box-shadow: 0 8px 24px -12px rgba(15,15,20,.3); display: grid; gap: 8px; font-size: 13px; color: #15151b; }
      .ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .ctl select { font: inherit; padding: 4px 6px; border: 1px solid rgba(15,15,20,.2); border-radius: 6px; background: #fff; color: inherit; }
      .ctl select:focus-visible, .ctl input:focus-visible { outline: 2px solid #15151b; outline-offset: 2px; }
      @media (max-width: 520px) { .panel { width: auto; right: 16px; grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This demo needs JavaScript.</noscript>
    <script src="./app.js"></script>
  </body>
</html>
