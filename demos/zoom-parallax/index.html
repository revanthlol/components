<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Parallax Experience | Components Vault</title>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#030712; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; overflow-x:hidden; }
    .hero { height:75vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
    .hero h1 { font-size:3.5rem; font-weight:800; letter-spacing:-0.03em; margin-bottom:1rem; background:linear-gradient(135deg,#fff,#94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .hero p { font-size:1.2rem; color:#9ca3af; max-width:500px; }
    .scroll-indicator { margin-top:2rem; display:inline-flex; align-items:center; gap:0.5rem; font-size:0.9rem; color:#60a5fa; text-transform:uppercase; letter-spacing:0.1em; }
    
    .parallax-wrapper { position:relative; height:300vh; }
    .parallax-sticky { position:sticky; top:0; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    
    .card { position:absolute; width:26vw; height:28vh; border-radius:16px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.12); will-change:transform; }
    .card img { width:100%; height:100%; object-fit:cover; }
    
    /* Radial spotlight */
    .spotlight { position:absolute; width:120vmin; height:120vmin; background:radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); filter:blur(40px); pointer-events:none; }
    .footer-spacer { height:80vh; display:flex; align-items:center; justify-content:center; text-align:center; color:#64748b; font-size:1.2rem; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Scroll-Driven Zoom Parallax</h1>
    <p>Smooth momentum-scrolling dynamic scale depth animation.</p>
    <div class="scroll-indicator">
      <span>Scroll Down</span> ↓
    </div>
  </div>

  <div class="parallax-wrapper" id="parallax">
    <div class="parallax-sticky">
      <div class="spotlight"></div>
      
      <!-- Center Main Card -->
      <div class="card" id="card0" style="z-index:10;">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80" alt="Abstract Visual 1">
      </div>

      <!-- Top Left -->
      <div class="card" id="card1" style="top:10vh; left:8vw; width:30vw; height:30vh;">
        <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80" alt="Abstract Visual 2">
      </div>

      <!-- Top Right -->
      <div class="card" id="card2" style="top:12vh; right:8vw; width:28vw; height:32vh;">
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1200&q=80" alt="Abstract Visual 3">
      </div>

      <!-- Bottom Left -->
      <div class="card" id="card3" style="bottom:12vh; left:12vw; width:28vw; height:26vh;">
        <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1200&q=80" alt="Abstract Visual 4">
      </div>

      <!-- Bottom Right -->
      <div class="card" id="card4" style="bottom:10vh; right:10vw; width:32vw; height:30vh;">
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80" alt="Abstract Visual 5">
      </div>
    </div>
  </div>

  <div class="footer-spacer">
    <p>Component scales back into viewport frame seamlessly on scroll up.</p>
  </div>

  <script>
    const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    const wrapper = document.getElementById('parallax');
    const cards = [
      { el: document.getElementById('card0'), maxScale: 4.5 },
      { el: document.getElementById('card1'), maxScale: 5.5 },
      { el: document.getElementById('card2'), maxScale: 6.2 },
      { el: document.getElementById('card3'), maxScale: 5.8 },
      { el: document.getElementById('card4'), maxScale: 6.8 },
    ];

    window.addEventListener('scroll', () => {
      const rect = wrapper.getBoundingClientRect();
      const progress = Math.min(Math.max(-rect.top / (rect.height - window.innerHeight), 0), 1);
      
      cards.forEach(({ el, maxScale }) => {
        const scale = 1 + progress * (maxScale - 1);
        el.style.transform = ;
      });
    });
  </script>
<!-- Floating Vault Navigation Pill -->
<div style="position:fixed; top:1.25rem; right:1.25rem; z-index:999999; display:flex; gap:0.6rem; align-items:center; background:rgba(10,12,18,0.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.18); border-radius:9999px; padding:0.4rem 0.95rem; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:13px; font-weight:500; color:#fff; box-shadow:0 12px 32px rgba(0,0,0,0.5); pointer-events:auto;">
  <a href="/" style="color:#cbd5e1; text-decoration:none; display:flex; align-items:center; gap:0.35rem; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#cbd5e1'">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span>Components</span>
  </a>
  <span style="color:rgba(255,255,255,0.25);">|</span>
  <a href="https://github.com/revanthlol/components" target="_blank" style="color:#38bdf8; text-decoration:none; display:flex; align-items:center; gap:0.3rem; transition:opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
    <span>GitHub</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </a>
</div>
</body>
</html>
